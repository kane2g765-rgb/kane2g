
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小説家けんゆうの公式ホームページ。小説作品、物語の世界、創作活動や最新情報をご紹介します。">
  <title>けんゆう 公式サイト｜小説家・物語の世界</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8f6f2;
      color: #302b33;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      line-height: 1.9;
    }
    header {
      background: #24213b;
      color: white;
      padding: 24px 7%;
    }
    header h1 { margin: 0; font-size: 26px; }
    nav { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 20px; }
    nav a { color: white; text-decoration: none; }
    .hero {
      text-align: center;
      padding: 110px 20px;
      background: linear-gradient(135deg, #29243f, #5a4566);
      color: white;
    }
    .hero h2 { font-size: clamp(30px, 6vw, 52px); font-weight: normal; }
    section { max-width: 1000px; margin: auto; padding: 65px 25px; }
    section h2 { text-align: center; font-weight: normal; letter-spacing: 3px; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      margin: 20px 0;
      box-shadow: 0 3px 15px #00000010;
    }
    footer { text-align: center; padding: 30px; background: #24213b; color: white; }
    a { color: #725184; }

<body>

<header>
  <h1>けんゆう</h1>
  <nav>
    <a href="#about">プロフィール</a>
    <a href="#works">小説作品</a>

  </nav>

<div class="hero">

    </div>
  </section>

  <section id="works">

      <h3>小説作品</h3>
      <p>作品の表紙、あらすじ、公開先などを順次ご紹介します。</p>
    </div>

  <section id="news">
    <h2>NEWS</h2>
    <div class="card">
      <p>新作や創作活動に関するお知らせを掲載します。</p>
    </div>

  <section id="contact">

    <div class="card">
      <p>作品についてのお問い合わせはこちらへ。</p>
      <p><a href="mailto:kane2g765@gmail.com">kane2g765@gmail.com</a></p>

<footer>
  <p>© けんゆう 公式サイト</p>
